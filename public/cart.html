<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - TechHub</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <div class="container">
      <h2 class="section-title">Shopping Cart</h2>
      <div id="cart"></div>
      <div id="total"></div>
    </div>
  </main>
  <script src="/layout.js"></script>
  <script>
    fetch('/api/cart').then(r => r.json()).then(items => {
      if (items.length === 0) {
        document.getElementById('cart').innerHTML = '<div class="empty-state"><h3>Your cart is empty</h3><p>Start shopping to add items</p></div>';
        return;
      }

      document.getElementById('cart').innerHTML = items.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <h3>${item.name}</h3>
            <p>Quantity: ${item.qty} × $${item.price}</p>
          </div>
          <div class="cart-item-actions">
            <strong>$${(item.qty * item.price).toFixed(2)}</strong>
            <button class="btn btn-danger" onclick="removeItem('${item.id}')">Remove</button>
          </div>
        </div>
      `).join('');

      const total = items.reduce((sum, item) => sum + (item.qty * item.price), 0);
      document.getElementById('total').innerHTML = `
        <div class="cart-total">
          <h3>Total: $${total.toFixed(2)}</h3>
          <button class="btn btn-primary" onclick="location.href='/checkout.html'">Proceed to Checkout</button>
        </div>
      `;
    });

    function removeItem(id) {
      fetch('/api/cart/' + id, { method: 'DELETE' }).then(() => location.reload());
    }
  </script>
</body>
</html>
