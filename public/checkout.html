<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - TechHub</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <div class="container">
      <h2 class="section-title">Checkout</h2>
      <div class="checkout-container">
        <div class="checkout-form">
          <h3>Shipping Information</h3>
          <form id="checkoutForm">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" name="name" required>
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" name="email" required>
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" name="phone" required>
            </div>
            <div class="form-group">
              <label>Address</label>
              <input type="text" name="address" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>City</label>
                <input type="text" name="city" required>
              </div>
              <div class="form-group">
                <label>Postal Code</label>
                <input type="text" name="postal" required>
              </div>
            </div>
            <div class="form-group">
              <label>Country</label>
              <input type="text" name="country" required>
            </div>
            <h3 style="margin-top: 24px;">Payment Information</h3>
            <div class="form-group">
              <label>Card Number</label>
              <input type="text" placeholder="1234 5678 9012 3456" maxlength="19" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Expiry Date</label>
                <input type="text" placeholder="MM/YY" maxlength="5" required>
              </div>
              <div class="form-group">
                <label>CVV</label>
                <input type="text" placeholder="123" maxlength="3" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Place Order</button>
          </form>
        </div>
        <div class="order-summary">
          <h3>Order Summary</h3>
          <div id="summaryItems"></div>
          <div class="summary-total">
            <span>Subtotal</span>
            <span id="subtotal">$0.00</span>
          </div>
          <div class="summary-total">
            <span>Shipping</span>
            <span>$9.99</span>
          </div>
          <div class="summary-total summary-grand">
            <span>Total</span>
            <span id="grandTotal">$0.00</span>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="/layout.js"></script>
  <script>
    fetch('/api/cart').then(r => r.json()).then(items => {
      if (items.length === 0) {
        location.href = '/cart.html';
        return;
      }

      document.getElementById('summaryItems').innerHTML = items.map(item => `
        <div class="summary-item">
          <span>${item.name} × ${item.qty}</span>
          <span>$${(item.qty * item.price).toFixed(2)}</span>
        </div>
      `).join('');

      const subtotal = items.reduce((sum, item) => sum + (item.qty * item.price), 0);
      const shipping = 9.99;
      const total = subtotal + shipping;

      document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
      document.getElementById('grandTotal').textContent = `$${total.toFixed(2)}`;
    });

    document.getElementById('checkoutForm').addEventListener('submit', (e) => {
      e.preventDefault();
      fetch('/api/cart', { method: 'DELETE' }).then(() => {
        location.href = '/';
      });
    });
  </script>
</body>
</html>
